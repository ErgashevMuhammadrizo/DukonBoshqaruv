name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Django checks
        run: python manage.py check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-for-validation-123456789
          DEBUG: '1'
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-for-validation-123456789
          DEBUG: '1'
      - name: Backend tests
        run: python manage.py test tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-for-validation-123456789
          DEBUG: '1'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dokon_boshqaruv
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

# This workflow verifies source changes; it never deploys to production.
