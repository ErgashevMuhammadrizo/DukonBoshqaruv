services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dokon}
      POSTGRES_USER: ${POSTGRES_USER:-dokon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokon123}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
        reservations: {memory: 512M}
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - product_media:/app/media
      - backup_data:/var/backups/dokon
      - static_data:/app/staticfiles:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    # Run migrations as a reviewed release step: docker compose run --rm api python manage.py migrate
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-", "--error-logfile", "-"]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}
        reservations: {memory: 256M}
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - product_media:/app/media
      - backup_data:/var/backups/dokon
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "manage.py", "migrate", "--noinput"]
    profiles: [release]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  collectstatic:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes: [static_data:/app/staticfiles]
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    profiles: [release]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes: [backup_data:/var/backups/dokon]
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "manage.py", "run_backup_scheduler"]
    profiles: [backup]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
volumes:
  pgdata:
  product_media:
  backup_data:
  static_data:
