
name: dokon_boshqaruv
description: Dokon Boshqaruv — savdo va ombor boshqaruvi
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.0+1
  path: ^1.9.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  go_router: ^14.8.1
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/vexo_app_icon.png"
  adaptive_icon_background: "#030A09"
  adaptive_icon_foreground: "assets/branding/vexo_app_icon.png"
